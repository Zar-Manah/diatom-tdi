<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E2439" stop-opacity="1"/>
      <stop offset="70%" stop-color="#07111D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#03070E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="frustuleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle / circular dark canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Bioindicator outer halo ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.3"/>

  <!-- Diatom Valve Outer Shell (Naviculoid Frustule) -->
  <g filter="url(#glow)">
    <path d="M 256 65 
             C 325 130, 360 200, 360 256 
             C 360 312, 325 382, 256 447 
             C 187 382, 152 312, 152 256 
             C 152 200, 187 130, 256 65 Z" 
          fill="none" 
          stroke="url(#frustuleGrad)" 
          stroke-width="5" 
          stroke-linejoin="round"/>
  </g>

  <!-- Axial Raphe Slit (Central line) -->
  <line x1="256" y1="95" x2="256" y2="238" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="256" y1="274" x2="256" y2="417" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Central Nodule & Polar Nodules -->
  <circle cx="256" cy="256" r="10" fill="#E0F2FE" stroke="#06B6D4" stroke-width="2"/>
  <circle cx="256" cy="95" r="4" fill="#38BDF8"/>
  <circle cx="256" cy="417" r="4" fill="#10B981"/>

  <!-- Transapical Striae (Siliceous ribs, symmetrical) -->
  <g stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <!-- Top Half -->
    <line x1="236" y1="125" x2="202" y2="128"/><line x1="276" y1="125" x2="310" y2="128"/>
    <line x1="232" y1="145" x2="190" y2="150"/><line x1="280" y1="145" x2="322" y2="150"/>
    <line x1="228" y1="165" x2="180" y2="172"/><line x1="284" y1="165" x2="332" y2="172"/>
    <line x1="225" y1="185" x2="174" y2="193"/><line x1="287" y1="185" x2="338" y2="193"/>
    <line x1="222" y1="205" x2="168" y2="215"/><line x1="290" y1="205" x2="344" y2="215"/>
    <line x1="220" y1="225" x2="164" y2="236"/><line x1="292" y1="225" x2="348" y2="236"/>

    <!-- Bottom Half -->
    <line x1="220" y1="287" x2="164" y2="276"/><line x1="292" y1="287" x2="348" y2="276"/>
    <line x1="222" y1="307" x2="168" y2="297"/><line x1="290" y1="307" x2="344" y2="297"/>
    <line x1="225" y1="327" x2="174" y2="319"/><line x1="287" y1="327" x2="338" y2="319"/>
    <line x1="228" y1="347" x2="180" y2="340"/><line x1="284" y1="347" x2="332" y2="340"/>
    <line x1="232" y1="367" x2="190" y2="362"/><line x1="280" y1="367" x2="322" y2="362"/>
    <line x1="236" y1="387" x2="202" y2="384"/><line x1="276" y1="387" x2="310" y2="384"/>
  </g>

  <!-- Purity Core Spark -->
  <circle cx="256" cy="256" r="3" fill="#FFFFFF"/>
</svg>
